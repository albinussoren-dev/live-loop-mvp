services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - looplive-data:/app/data
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    command: ["python","-m","app.worker"]
    restart: unless-stopped
volumes:
  looplive-data:
